name: OpenGlasses
options:
  bundleIdPrefix: com.openglasses
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    # PINNED EXACT — do not float. The app source targets the 0.5.0 API
    # (StreamSession, StreamSessionConfig, DeviceStateSession, VideoFrame…).
    # A floating `from: "0.3.0"` let a fresh CI resolve drift to 0.8.0, whose
    # API renamed/removed those types → archive compile-failed (run 30123851437).
    # xcodegen regenerates the .xcodeproj and discards the pinned Package.resolved,
    # so the version MUST be pinned here to stay reproducible.
    exactVersion: "0.5.0"

targets:
  OpenGlasses:
    type: application
    platform: iOS
    sources:
      - path: OpenGlasses/Sources
      - path: OpenGlasses/Secrets.plist
        buildPhase: resources
        optional: true
    resources:
      - path: OpenGlasses/Sources/Resources
    info:
      path: OpenGlasses/Info.plist
      properties:
        CFBundleName: "Glasses"
        CFBundleDisplayName: "Glasses"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Dolores needs microphone access to listen for wake words and transcribe your voice commands."
        NSSpeechRecognitionUsageDescription: "Dolores uses speech recognition to detect the wake word and transcribe your questions."
        NSPhotoLibraryUsageDescription: "Glasses saves photos to a dedicated album in your photo library."
        NSPhotoLibraryAddUsageDescription: "Glasses saves photos taken with your Ray-Ban Meta glasses to your photo library."
        NSCameraUsageDescription: "Dolores needs camera access to capture photos and video for the AI to analyze."
        NSBluetoothAlwaysUsageDescription: "Dolores uses Bluetooth to connect to your Ray-Ban Meta smart glasses."
        NSBluetoothPeripheralUsageDescription: "Dolores uses Bluetooth to connect to your Ray-Ban Meta smart glasses."
        NSLocationWhenInUseUsageDescription: "Dolores uses your location to provide contextually relevant answers based on where you are."
        UISupportedExternalAccessoryProtocols:
          - "com.meta.ar.wearable"
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        LSApplicationQueriesSchemes:
          - "fb-viewapp"
        MWDAT:
          AppLinkURLScheme: "mwdat-688603774243722://"
          MetaAppID: "688603774243722"
          ClientToken: "AR|688603774243722|906db0d1b28450fdb718401ca16b9d60"
          TeamID: "$(DEVELOPMENT_TEAM)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "mwdat-688603774243722"
    entitlements:
      path: OpenGlasses/OpenGlasses.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores
        DEVELOPMENT_TEAM: UUSSWWML2A
        MARKETING_VERSION: "1.3.1"
        # Local/base value only — CI overrides via CURRENT_PROJECT_VERSION=<ASC latest + 1>
        # so uploads never collide with an existing App Store Connect build number.
        CURRENT_PROJECT_VERSION: "18"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
      configs:
        Release:
          CODE_SIGN_STYLE: "Manual"
          PROVISIONING_PROFILE_SPECIFIER: "OpenGlasses App Store"
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      - target: GlassesActivityWidget
    # Explicit SHARED scheme. Without this the only schemes are Xcode's implicit
    # auto-created ones (xcuserdata, not in git), which CI cannot rely on for
    # `xcodebuild test -only-testing:OpenGlassesTests`.
    scheme:
      testTargets:
        - OpenGlassesTests

  # Unit tests for the iOS app. Hosted by the OpenGlasses target so the test
  # bundle can `@testable import OpenGlasses`. Without this target xcodegen
  # generates no test bundle at all and the checked-in OpenGlassesTests/*.swift
  # are never compiled or run (CI silently tested nothing).
  OpenGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenGlassesTests
    dependencies:
      - target: OpenGlasses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores.tests
        DEVELOPMENT_TEAM: UUSSWWML2A
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        GENERATE_INFOPLIST_FILE: "YES"

  DoloresWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: DoloresWatch
        excludes:
          - "**/*.plist"
    resources:
      - path: DoloresWatch/Assets.xcassets
      - path: DoloresWatch/Secrets.plist
    info:
      path: DoloresWatch/Info.plist
      properties:
        WKApplication: true
        CFBundleName: "Dolores"
        CFBundleDisplayName: "Dolores"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores.watchkitapp
        DEVELOPMENT_TEAM: UUSSWWML2A
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
      configs:
        Release:
          CODE_SIGN_STYLE: "Manual"
          PROVISIONING_PROFILE_SPECIFIER: "OpenGlasses Watch App Store"

  GlassesActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GlassesActivityWidget
      - path: OpenGlasses/Sources/Models/GlassesActivityAttributes.swift
    resources:
      - path: GlassesActivityWidget/Assets.xcassets
    info:
      path: GlassesActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: "Glasses Activity"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores.activity-widget
        DEVELOPMENT_TEAM: UUSSWWML2A
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: "Manual"
          PROVISIONING_PROFILE_SPECIFIER: "OpenGlasses Widget App Store"
