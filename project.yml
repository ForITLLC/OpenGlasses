name: OpenGlasses
options:
  bundleIdPrefix: com.openglasses
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    # PINNED EXACT — do not float. The app source targets the 0.5.0 API
    # (StreamSession, StreamSessionConfig, DeviceStateSession, VideoFrame…).
    # A floating `from: "0.3.0"` let a fresh CI resolve drift to 0.8.0, whose
    # API renamed/removed those types → archive compile-failed (run 30123851437).
    # xcodegen regenerates the .xcodeproj and discards the pinned Package.resolved,
    # so the version MUST be pinned here to stay reproducible.
    exactVersion: "0.5.0"
  # Shared ForIT code by URL (for-iCommon, private): ForIT Sign-in and Send feedback (FB-1).
  # The phone app links the package; Watch/activity use the matching generated bridges.
  # Pinned exact like the SDK above, for the same reason: Scripts/mini-testflight.sh runs the App
  # Shared mark, profile panel and App Store provisioning from the tested release.
  ForITCommon:
    url: https://github.com/ForITLLC/for-iCommon.git
    exactVersion: "0.31.9"

# Generate these required inputs before XcodeGen, as mini-testflight.sh does.
# The maintained mark adapter requires explicit regular records without optional/group
# overrides. Actual Sources/Resources membership still needs native verification.
targetTemplates:
  PackageFreeSharedBridges:
    sources:
      - path: .build/forit-bridges/${target_name}/Mark/ForITMark.swift
        type: file
        buildPhase: sources
      - path: .build/forit-bridges/${target_name}/Mark/ForITMarkBridgePalette.swift
        type: file
        buildPhase: sources
      - path: .build/forit-bridges/${target_name}/Controls/ForITBrand.swift
        type: file
        buildPhase: sources
      - path: .build/forit-bridges/${target_name}/Controls/ForITControlMetrics.swift
        type: file
        buildPhase: sources
      - path: .build/forit-bridges/${target_name}/Controls/ForITControls.swift
        type: file
        buildPhase: sources
      - path: .build/forit-bridges/${target_name}/Mark/forit-hex.png
        type: file
        buildPhase: resources
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FORIT_MARK_BRIDGE"
    preBuildScripts:
      - name: Export published Common mark and Controls bridges
        script: |
          set -eu
          python3 "$SRCROOT/Scripts/prepare-shared-bridges.py" --output "$SRCROOT/.build/forit-bridges/$TARGET_NAME"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/Scripts/prepare-shared-bridges.py
        outputFiles:
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Mark/ForITMark.swift
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Mark/ForITMarkBridgePalette.swift
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Mark/forit-hex.png
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Mark/manifest.json
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Mark/mark-auth-manifest.json
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Controls/ForITBrand.swift
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Controls/ForITControlMetrics.swift
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Controls/ForITControls.swift
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/Controls/controls-manifest.json
          - $(SRCROOT)/.build/forit-bridges/$(TARGET_NAME)/bridge-manifest.json

targets:
  OpenGlasses:
    preBuildScripts:
      - name: Maintained shared control source guard (iOS)
        script: |
          # Ben's October 26 ship-all instruction makes BR-3 advisory for this app.
          {
            if /usr/bin/python3 -I "$FORIT_COMMON_ROOT/Scripts/control-guard/control_guard.py" --inputs "$SRCROOT/Config/ControlGuard/OpenGlasses-iOS-inputs.json" --report "/tmp/forit-openglasses-shared-mark-OpenGlasses-iOS-br3.json" --common-revision 352f567e839b8faf61b6df5840c5275b016addce; then
              br3_exit=0
            else
              br3_exit=$?
            fi
            printf '%s\n' "$br3_exit" > "/tmp/forit-openglasses-shared-mark-OpenGlasses-iOS-br3.json.exit-code"
            if [ "$br3_exit" -ne 0 ]; then
              printf 'warning: BR-3 advisory check exited %s; raw report: %s\n' "$br3_exit" "/tmp/forit-openglasses-shared-mark-OpenGlasses-iOS-br3.json"
            fi
          } 2>&1 | sed 's/: error: BR-3 /: warning: BR-3 /g'
          exit 0
        basedOnDependencyAnalysis: false
        showEnvVars: false
    type: application
    platform: iOS
    sources:
      - path: OpenGlasses/Sources
      - path: OpenGlasses/Secrets.plist
        buildPhase: resources
        optional: true
    resources:
      - path: OpenGlasses/Sources/Resources
    info:
      path: OpenGlasses/Info.plist
      properties:
        CFBundleName: "ForIT Glasses"
        CFBundleDisplayName: "ForIT Glasses"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Bernard needs microphone access to listen for wake words and transcribe your voice commands."
        NSSpeechRecognitionUsageDescription: "Bernard uses speech recognition to detect the wake word and transcribe your questions."
        NSPhotoLibraryUsageDescription: "Glasses saves photos to a dedicated album in your photo library."
        NSPhotoLibraryAddUsageDescription: "Glasses saves photos taken with your Ray-Ban Meta glasses to your photo library."
        NSCameraUsageDescription: "Bernard needs camera access to capture photos and video for the AI to analyze."
        NSBluetoothAlwaysUsageDescription: "Bernard uses Bluetooth to connect to your Ray-Ban Meta smart glasses."
        NSBluetoothPeripheralUsageDescription: "Bernard uses Bluetooth to connect to your Ray-Ban Meta smart glasses."
        NSLocationWhenInUseUsageDescription: "Bernard uses your location to provide contextually relevant answers based on where you are."
        UISupportedExternalAccessoryProtocols:
          - "com.meta.ar.wearable"
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        LSApplicationQueriesSchemes:
          - "fb-viewapp"
        MWDAT:
          AppLinkURLScheme: "mwdat-688603774243722://"
          MetaAppID: "688603774243722"
          ClientToken: "AR|688603774243722|906db0d1b28450fdb718401ca16b9d60"
          TeamID: "$(DEVELOPMENT_TEAM)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "mwdat-688603774243722"
          # ForIT Sign-in's redirect (FeedbackAccount.redirectURI).
          - CFBundleURLSchemes:
              - "io.forit.glasses"
    entitlements:
      path: OpenGlasses/OpenGlasses.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: UUSSWWML2A
        MARKETING_VERSION: "1.3.1"
        # Local/base value only — CI overrides via CURRENT_PROJECT_VERSION=<ASC latest + 1>
        # so uploads never collide with an existing App Store Connect build number.
        CURRENT_PROJECT_VERSION: "18"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
      configs:
        Release:
          CODE_SIGN_STYLE: "Manual"
          PROVISIONING_PROFILE_SPECIFIER: "OpenGlasses App Store"
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      - package: ForITCommon
      - target: GlassesActivityWidget
    # Explicit SHARED scheme. Without this the only schemes are Xcode's implicit
    # auto-created ones (xcuserdata, not in git), which CI cannot rely on for
    # `xcodebuild test -only-testing:OpenGlassesTests`.
    scheme:
      testTargets:
        - OpenGlassesTests

  # Unit tests for the iOS app. Hosted by the OpenGlasses target so the test
  # bundle can `@testable import OpenGlasses`. Without this target xcodegen
  # generates no test bundle at all and the checked-in OpenGlassesTests/*.swift
  # are never compiled or run (CI silently tested nothing).
  OpenGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenGlassesTests
    dependencies:
      - target: OpenGlasses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores.tests
        DEVELOPMENT_TEAM: UUSSWWML2A
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        GENERATE_INFOPLIST_FILE: "YES"

  # UI proof has its own scheme; the normal OpenGlasses scheme keeps unit tests only.
  OpenGlassesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OpenGlassesUITests
    dependencies:
      - target: OpenGlasses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores.uitests
        TEST_TARGET_NAME: OpenGlasses
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: UUSSWWML2A
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        GENERATE_INFOPLIST_FILE: "YES"

  DoloresWatch:
    preBuildScripts:
      - name: Maintained shared control source guard (watchOS)
        script: |
          # Ben's October 26 ship-all instruction makes BR-3 advisory for this app.
          {
            if /usr/bin/python3 -I "$FORIT_COMMON_ROOT/Scripts/control-guard/control_guard.py" --inputs "$SRCROOT/Config/ControlGuard/DoloresWatch-watchOS-inputs.json" --report "/tmp/forit-openglasses-shared-mark-DoloresWatch-watchOS-br3.json" --common-revision 352f567e839b8faf61b6df5840c5275b016addce; then
              br3_exit=0
            else
              br3_exit=$?
            fi
            printf '%s\n' "$br3_exit" > "/tmp/forit-openglasses-shared-mark-DoloresWatch-watchOS-br3.json.exit-code"
            if [ "$br3_exit" -ne 0 ]; then
              printf 'warning: BR-3 advisory check exited %s; raw report: %s\n' "$br3_exit" "/tmp/forit-openglasses-shared-mark-DoloresWatch-watchOS-br3.json"
            fi
          } 2>&1 | sed 's/: error: BR-3 /: warning: BR-3 /g'
          exit 0
        basedOnDependencyAnalysis: false
        showEnvVars: false
    templates: [PackageFreeSharedBridges]
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: DoloresWatch
        excludes:
          - "**/*.plist"
    resources:
      - path: DoloresWatch/Assets.xcassets
      - path: DoloresWatch/Secrets.plist
    info:
      path: DoloresWatch/Info.plist
      properties:
        WKApplication: true
        CFBundleName: "ForIT Glasses"
        CFBundleDisplayName: "ForIT Glasses"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores.watchkitapp
        DEVELOPMENT_TEAM: UUSSWWML2A
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
      configs:
        Release:
          CODE_SIGN_STYLE: "Manual"
          PROVISIONING_PROFILE_SPECIFIER: "OpenGlasses Watch App Store"

  GlassesActivityWidget:
    preBuildScripts:
      - name: Maintained shared control source guard (iOS)
        script: |
          # Ben's October 26 ship-all instruction makes BR-3 advisory for this app.
          {
            if /usr/bin/python3 -I "$FORIT_COMMON_ROOT/Scripts/control-guard/control_guard.py" --inputs "$SRCROOT/Config/ControlGuard/GlassesActivityWidget-iOS-inputs.json" --report "/tmp/forit-openglasses-shared-mark-GlassesActivityWidget-iOS-br3.json" --common-revision 352f567e839b8faf61b6df5840c5275b016addce; then
              br3_exit=0
            else
              br3_exit=$?
            fi
            printf '%s\n' "$br3_exit" > "/tmp/forit-openglasses-shared-mark-GlassesActivityWidget-iOS-br3.json.exit-code"
            if [ "$br3_exit" -ne 0 ]; then
              printf 'warning: BR-3 advisory check exited %s; raw report: %s\n' "$br3_exit" "/tmp/forit-openglasses-shared-mark-GlassesActivityWidget-iOS-br3.json"
            fi
          } 2>&1 | sed 's/: error: BR-3 /: warning: BR-3 /g'
          exit 0
        basedOnDependencyAnalysis: false
        showEnvVars: false
    templates: [PackageFreeSharedBridges]
    type: app-extension
    platform: iOS
    sources:
      - path: GlassesActivityWidget
      - path: OpenGlasses/Sources/Models/GlassesActivityAttributes.swift
    resources:
      - path: GlassesActivityWidget/Assets.xcassets
    info:
      path: GlassesActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: "Glasses Activity"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forit.openglasses.dolores.activity-widget
        DEVELOPMENT_TEAM: UUSSWWML2A
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: "Manual"
          PROVISIONING_PROFILE_SPECIFIER: "OpenGlasses Widget App Store"

# Deliberate UI proof entry point; not used by mini-testflight.sh's unit-test route.
schemes:
  OpenGlasses-VisualProof:
    build:
      targets:
        OpenGlasses: [test]
        OpenGlassesUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OpenGlassesUITests
          parallelizable: false
          randomExecutionOrder: false
    management:
      shared: true
