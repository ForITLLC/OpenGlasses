name: Build & Upload to App Store Connect

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  SCHEME: OpenGlasses
  PROJECT: OpenGlasses.xcodeproj
  TEAM_ID: UUSSWWML2A
  ASC_KEY_ID: 78ND83SSBB
  ASC_ISSUER_ID: b21bbf92-e667-43f9-b358-29908a814489

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use Xcode 26.2 (default on macos-26 runner, iOS 26 SDK)
          sudo xcode-select -s /Applications/Xcode_26.2.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Verify iOS SDK
        run: |
          xcrun simctl list runtimes | head -5

      - name: Install signing materials
        env:
          DISTRIBUTION_CERT_BASE64: ${{ secrets.DISTRIBUTION_CERT_BASE64 }}
          DISTRIBUTION_KEY_BASE64: ${{ secrets.DISTRIBUTION_KEY_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROFILE_BASE64: ${{ secrets.WATCH_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import cert + key
          echo -n "$DISTRIBUTION_CERT_BASE64" | base64 -D > $RUNNER_TEMP/dist.cer
          security import $RUNNER_TEMP/dist.cer -k $KEYCHAIN_PATH -A
          echo -n "$DISTRIBUTION_KEY_BASE64" | base64 -D > $RUNNER_TEMP/dist.key
          security import $RUNNER_TEMP/dist.key -k $KEYCHAIN_PATH -A

          # Apple WWDR intermediate
          curl -sO https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Install all 3 provisioning profiles
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$PP_DIR/openglasses.mobileprovision"
          echo -n "$WATCH_PROFILE_BASE64" | base64 -D > "$PP_DIR/watch.mobileprovision"
          echo -n "$WIDGET_PROFILE_BASE64" | base64 -D > "$PP_DIR/widget.mobileprovision"

          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Create Secrets.plist
        env:
          DOLORES_API_KEY: ${{ secrets.DOLORES_API_KEY }}
        run: |
          cat > OpenGlasses/Secrets.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>DOLORES_API_KEY</key>
            <string>${DOLORES_API_KEY:-placeholder}</string>
          </dict>
          </plist>
          PLIST

      - name: Generate Xcode project
        run: |
          brew install xcodegen || true
          xcodegen

      # Runs AFTER Secrets.plist exists (ConfigTests asserts a non-empty
      # DOLORES_API_KEY) and BEFORE Archive, so a red test blocks the upload.
      - name: Run unit tests
        run: |
          set -o pipefail
          # Resolve a concrete iPhone simulator UDID. Destination-by-name is
          # brittle across runner-image updates; the UDID from simctl is not.
          SIM_UDID=$(xcrun simctl list devices available \
            | sed -n '/-- iOS/,/^--/p' \
            | grep -E '^[[:space:]]+iPhone' \
            | head -1 \
            | grep -oE '[0-9A-Fa-f-]{36}')
          if [ -z "$SIM_UDID" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator $SIM_UDID"
          xcodebuild test \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -destination "id=$SIM_UDID" \
            -only-testing:OpenGlassesTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee xctest.log
          echo "--- test summary ---"
          grep -E "Executed [0-9]+ test|\*\* TEST (SUCCEEDED|FAILED) \*\*" xctest.log | tail -5

      - name: Determine build number (ASC latest + 1)
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          APP_ID: "6761319043"
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          BUILD_NUMBER=$(python3 <<'PYEOF'
          import jwt, time, os, json, base64, urllib.request
          key = base64.b64decode(os.environ["ASC_KEY_BASE64"]).decode()
          tok = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time())+600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          h = {"Authorization": f"Bearer {tok}"}
          app = os.environ["APP_ID"]
          req = urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app}&limit=200&fields[builds]=version",
              headers=h)
          data = json.load(urllib.request.urlopen(req))
          nums = [int(b["attributes"]["version"]) for b in data["data"] if str(b["attributes"]["version"]).isdigit()]
          print(max(nums)+1 if nums else 1)
          PYEOF
          )
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Computed build number (ASC max + 1): $BUILD_NUMBER"

      - name: Archive
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$ASC_KEY_BASE64" | base64 -D > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          echo "Archiving with CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          xcodebuild -project $PROJECT -scheme $SCHEME \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/OpenGlasses.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution: ForIT Limited Liability Company ($TEAM_ID)" \
            ENABLE_PREVIEWS=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=NO \
            archive

      - name: Export & Upload
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$ASC_KEY_BASE64" | base64 -D > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>UUSSWWML2A</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/OpenGlasses.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID \
            -authenticationKeyIssuerID $ASC_ISSUER_ID

      - name: Clear export compliance + assign to internal group
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          APP_ID: "6761319043"
          # "ForIT Internal" — purpose-built internal group (isInternalGroup=true, hasAccessToAllBuilds=true)
          GROUP_ID: "971212a6-200e-4b9d-82cb-433d9c5105f2"
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 << 'PYEOF'
          import jwt, time, json, os, urllib.request, urllib.error, base64
          key_pem = base64.b64decode(os.environ["ASC_KEY_BASE64"]).decode()
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time())+600, "aud": "appstoreconnect-v1"},
              key_pem, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]},
          )
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          APP = os.environ["APP_ID"]
          GROUP = os.environ["GROUP_ID"]
          WANT = os.environ.get("BUILD_NUMBER", "").strip()  # target THIS build by version
          # Poll for the build we just uploaded to become VALID (processing ~1-15 min)
          bid = None
          for attempt in range(40):
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={APP}&sort=-uploadedDate&limit=10",
                  headers=h,
              )
              builds = json.load(urllib.request.urlopen(req))
              target = None
              for b in builds["data"]:
                  if WANT and str(b["attributes"]["version"]) == WANT:
                      target = b; break
              if target is None and not WANT and builds["data"]:
                  target = builds["data"][0]  # fallback: newest
              if target is not None:
                  state = target["attributes"]["processingState"]
                  if state == "VALID":
                      bid = target["id"]
                      print(f"Build {target['attributes']['version']} is VALID")
                      break
                  print(f"Attempt {attempt+1}: build {target['attributes'].get('version')} state={state}, waiting 30s")
              else:
                  print(f"Attempt {attempt+1}: build {WANT} not visible yet, waiting 30s")
              time.sleep(30)
          if not bid:
              print(f"Build {WANT or '(latest)'} did not become VALID in time — failing so it is not silently skipped")
              raise SystemExit(1)
          # Clear export compliance
          body = json.dumps({"data": {"type": "builds", "id": bid, "attributes": {"usesNonExemptEncryption": False}}}).encode()
          req = urllib.request.Request(f"https://api.appstoreconnect.apple.com/v1/builds/{bid}", data=body, headers=h, method="PATCH")
          try:
              resp = urllib.request.urlopen(req)
              print(f"Cleared export compliance — {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"Export compliance patch: {e.code} {e.read().decode()[:200]}")
          # Assign to beta group.
          # NOTE: An INTERNAL group with hasAccessToAllBuilds=true already exposes EVERY
          # build automatically — App Store Connect REJECTS explicit build->group assignment
          # for it with 422 ENTITY_UNPROCESSABLE "Cannot add internal group to a build."
          # (This 422 was previously print-swallowed, masking that the assign never happened.)
          # So: inspect the group first; skip the impossible POST for all-builds groups,
          # and fail LOUD on any genuinely unexpected error instead of printing past it.
          greq = urllib.request.Request(f"https://api.appstoreconnect.apple.com/v1/betaGroups/{GROUP}", headers=h)
          gattr = json.load(urllib.request.urlopen(greq))["data"]["attributes"]
          if gattr.get("hasAccessToAllBuilds"):
              print(f"Group '{gattr.get('name')}' is internal all-builds — build {WANT} is auto-available to its testers; no explicit assignment needed.")
          else:
              body = json.dumps({"data": [{"type": "builds", "id": bid}]}).encode()
              req = urllib.request.Request(f"https://api.appstoreconnect.apple.com/v1/betaGroups/{GROUP}/relationships/builds", data=body, headers=h, method="POST")
              try:
                  resp = urllib.request.urlopen(req)
                  print(f"Assigned to beta group — {resp.status}")
              except urllib.error.HTTPError as e:
                  msg = e.read().decode()
                  if e.code == 409:
                      print("Already assigned (409) — ok")
                  elif e.code == 422 and "internal group" in msg.lower():
                      print("Internal group — build auto-available; explicit assignment not applicable (422 benign).")
                  else:
                      print(f"ERROR {e.code}: {msg}")
                      raise SystemExit(1)
          PYEOF

      - name: Cleanup
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
